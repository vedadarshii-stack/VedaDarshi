name: vedadarshi
description: "Vedadarshi - Hindu Astrology application."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  firebase_core: ^4.11.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  google_fonts: ^6.2.1
  flutter_riverpod: ^2.6.1
  shared_preferences: ^2.5.5
  firebase_auth: ^6.5.6
  google_sign_in: ^7.2.0
  timezone: ^0.11.1
  http: ^1.6.0
  cloud_firestore: ^6.7.1
  flutter_dotenv: ^6.0.1
  firebase_messaging: ^16.4.3
  flutter_local_notifications: ^22.2.0
  permission_handler: ^12.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/logo/
    - assets/google_fonts/
    - assets/data/
    - assets/fonts/
    # Build-time secrets, loaded at startup by flutter_dotenv. This file is
    # gitignored — copy .env.example to .env before the first build, or the
    # build fails with "asset does not exist".
    - .env
  # ZodiacGlyphs is a custom-built 4KB subset of Noto Emoji containing only
  # the 12 zodiac codepoints (U+2648-2653), monochrome so it can be tinted
  # gold (see AppFonts.zodiac). It is declared as a normal Flutter font
  # family here — NOT dropped into assets/google_fonts/ — because it must
  # stay outside google_fonts' `Family-Variant.ttf` bundled-asset naming
  # convention and its runtime-fetch resolution path: it isn't a Google
  # Fonts family at all, just a hand-subsetted TTF, and forcing it through
  # that convention would either break GoogleFonts' name matching or risk
  # it being treated as fetchable at runtime.
  fonts:
    - family: ZodiacGlyphs
      fonts:
        - asset: assets/fonts/ZodiacGlyphs.ttf

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/logo/logo_veda_jyoti.png"
  adaptive_icon_background: "#172144"
  adaptive_icon_foreground: "assets/logo/logo_adaptive_foreground.png"

flutter_native_splash:
  color: "#172144"
  image: assets/logo/logo_veda_jyoti.png
  android_12:
    image: assets/logo/logo_adaptive_foreground.png
    icon_background_color: "#172144"
  android: true
  ios: false
