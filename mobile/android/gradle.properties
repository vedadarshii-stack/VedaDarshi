org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# Built-in Kotlin: OFF, deliberately, and NOT safe to flip yet.
#
# This is what produces the build warning "Your app uses the following
# plugins that apply Kotlin Gradle Plugin (KGP): cloud_functions ... Future
# versions of Flutter will fail to build". That warning is ADVISORY — the
# build succeeds today. Do not "fix" it by setting this to true without
# reading the rest of this comment; that was tried on 4 Aug 2026 and BREAKS
# THE BUILD.
#
# What was verified:
#  - We are on AGP 9.0.1 (android/settings.gradle.kts) and Gradle 9.1.0, so
#    AGP's own built-in Kotlin support IS available.
#  - `cloud_functions` — the plugin the warning actually names — is already
#    migrated and is NOT the blocker. Its build.gradle applies
#    `kotlin-android` only when `agpMajor < 9 || !builtInKotlin`, so it goes
#    quiet the moment this flag flips.
#  - The real blocker is the FlutterFire plugin subprojects: with the flag
#    on, evaluating `:cloud_firestore` fails with "Failed to apply plugin
#    'com.android.internal.library' > The 'org.jetbrains.kotlin.android'
#    plugin is no longer required for Kotlin support since AGP 9.0",
#    followed by "'kotlin-android' plugin requires one of the Android
#    Gradle plugins". Neither our app's `plugins {}` block nor the root
#    build file applies KGP, and cloud_firestore 6.8.0's own build.gradle
#    contains no Kotlin references at all — so KGP is being applied to
#    plugin subprojects by Flutter's own Gradle plugin, which is upstream
#    of this repo.
#
# Revisit when a Flutter release migrates its Gradle plugin. The check is
# cheap: flip both flags to true, run `flutter build apk --debug`, and if
# `:cloud_firestore` still fails, flip them back.
android.builtInKotlin=false
